name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Record exact source revision
        shell: bash
        run: |
          mkdir -p app/build/metadata
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > app/build/metadata/build-info.txt

      - name: Store APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linka-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/metadata/build-info.txt
          if-no-files-found: error
          retention-days: 30
