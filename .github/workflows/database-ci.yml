name: LINKA PostgreSQL Schema CI

on:
  push:
    branches: [main]
    paths:
      - "backend/api/db/**"
      - "backend/api/src/postgres-store.mjs"
      - "backend/api/test/postgres-*.test.mjs"
      - "backend/api/verify-browser-account.e2e.mjs"
      - "backend/api/package.json"
      - ".github/workflows/database-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/api/db/**"
      - "backend/api/src/postgres-store.mjs"
      - "backend/api/test/postgres-*.test.mjs"
      - "backend/api/verify-browser-account.e2e.mjs"
      - "backend/api/package.json"
      - ".github/workflows/database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linka-database-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-postgresql-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: linka_ci
          POSTGRES_USER: linka_ci
          POSTGRES_PASSWORD: linka_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linka_ci -d linka_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: linka_ci_password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: linka_ci
      PGDATABASE: linka_ci
    steps:
      - uses: actions/checkout@v7

      - name: Install API dependencies
        run: npm install --prefix backend/api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1

      - name: Apply all migrations twice (idempotency check)
        run: |
          for migration in backend/api/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          for migration in backend/api/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify schema, wallet transactions and constraints
        run: psql -v ON_ERROR_STOP=1 -f backend/api/db/checks/verify_core_schema.sql

      - name: Exercise PostgreSQL Node adapter and wallet transaction
        env:
          DATABASE_URL: postgresql://linka_ci:linka_ci_password@127.0.0.1:5432/linka_ci
        run: npm --prefix backend/api test

      - name: Verify API PostgreSQL readiness
        env:
          DATABASE_URL: postgresql://linka_ci:linka_ci_password@127.0.0.1:5432/linka_ci
        run: |
          PORT=8080 CORS_ALLOWED_ORIGINS=https://browser.example npm --prefix backend/api start > /tmp/linka-api-postgres.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz | grep -q "postgres-wallet-ledger"
          LINKA_API_URL=http://127.0.0.1:8080 node backend/api/verify-browser-account.e2e.mjs
          cat /tmp/linka-api-postgres.log | tail -n 30
