name: LINKA API CI

on:
  push:
    branches: [main]
    paths:
      - "backend/api/**"
      - ".github/workflows/linka-api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/api/**"
      - ".github/workflows/linka-api-ci.yml"
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run API tests
        run: npm --prefix backend/api test
      - name: Verify API starts
        run: |
          PORT=8080 npm --prefix backend/api start > /tmp/linka-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linka-api.log
          exit 1
