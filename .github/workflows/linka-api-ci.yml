name: LINKA API CI

on:
  push:
    branches: [main]
    paths:
      - "backend/api/**"
      - "web/**"
      - ".github/workflows/linka-api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/api/**"
      - "web/**"
      - ".github/workflows/linka-api-ci.yml"
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --prefix backend/api --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check browser module syntax
        run: |
          node --check web/account.mjs
          node --check web/auth-crypto.mjs
          node --check web/messaging-crypto.mjs
      - name: Run API tests
        run: npm --prefix backend/api test
      - name: Verify API starts
        run: |
          PORT=8080 CORS_ALLOWED_ORIGINS=https://browser.example npm --prefix backend/api start > /tmp/linka-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz
          curl --fail --silent http://127.0.0.1:8080/v1/info
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "LINKA"
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="accountEmail"'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="accountRegister"'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="accountLogin"'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'type="module" src="./account.mjs"'
          curl --fail --silent http://127.0.0.1:8080/styles.css | grep -q ":root"
          curl --fail --silent http://127.0.0.1:8080/app.js | grep -q "showView"
          curl --fail --silent http://127.0.0.1:8080/account.mjs | grep -q "createDeviceSession"
          curl --fail --silent http://127.0.0.1:8080/auth-crypto.mjs | grep -q "p1363ToDer"
          curl --fail --silent --show-error -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://browser.example" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            http://127.0.0.1:8080/v1/me | grep -qi "^access-control-allow-origin: https://browser.example"
          curl --fail --silent --show-error -D - -o /dev/null -X OPTIONS \\
            -H "Origin: https://browser.example" \\
            -H "Access-Control-Request-Method: DELETE" \\
            -H "Access-Control-Request-Headers: authorization" \\
            http://127.0.0.1:8080/v1/me/devices/example | grep -qi "^access-control-allow-methods: GET, POST, PUT, DELETE, OPTIONS"
          denied_origin_status=$(curl --silent --output /dev/null --write-out "%{http_code}" -X OPTIONS \
            -H "Origin: https://untrusted.example" \
            -H "Access-Control-Request-Method: GET" \
            http://127.0.0.1:8080/v1/me)
          test "$denied_origin_status" = "403"
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi "content-type: text/html"
          cat /tmp/linka-api.log | tail -n 30
